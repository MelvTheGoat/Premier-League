name: Update predictions

# Fixtures do not follow a weekly rhythm — a gameweek can be a fortnight
# away during an international break, or spread across four days. Rather
# than guess a schedule, this runs every morning and stops immediately if
# no new results have arrived since the database the site is serving.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain and publish even if no new results have arrived"
        type: boolean
        default: false

concurrency:
  group: update-predictions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Ingest results, retrain and predict the next gameweek
        id: pipeline
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/run_pipeline.py
          else
            python scripts/run_pipeline.py --skip-if-unchanged
          fi

      - name: Export the serving database
        if: steps.pipeline.outputs.changed == 'true'
        run: python scripts/export_web_db.py

      # A published database that the site cannot read would take the
      # whole site down until someone noticed. Checking here costs
      # seconds and keeps a bad export from ever being committed.
      - name: Check the site serves from the new database
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from plpredict.web.app import create_app, resolve_database

          path, read_only = resolve_database()
          print(f"serving {path} (read_only={read_only})")
          assert read_only, "the exported database should be served read-only"

          client = create_app().test_client()
          for route in ("/", "/model"):
              response = client.get(route)
              assert response.status_code < 400, f"{route} returned {response.status_code}"

          # Follow the redirect to whichever gameweek is current.
          landing = client.get("/", follow_redirects=True)
          assert landing.status_code == 200, landing.status_code
          assert b"Gameweek" in landing.data
          print("smoke check passed")
          PY

      - name: Commit and push
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/web/plpredict-web.db
          if git diff --staged --quiet; then
            echo "Serving database is byte-identical; nothing to commit."
            exit 0
          fi
          git commit -m "Update predictions through $(date -u +'%Y-%m-%d')"
          # Pick up anything pushed by hand since the job started. The job
          # only ever touches the serving database, so this rebases cleanly
          # against code changes; a genuine conflict should fail loudly
          # rather than be resolved blindly.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.pipeline.outputs.changed }}" = "true" ]; then
            echo "Published new predictions." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new results since the last run; nothing published." >> "$GITHUB_STEP_SUMMARY"
          fi
