name: Update predictions

# Fixtures do not follow a weekly rhythm — a gameweek can be a fortnight
# away during an international break, or spread across four days. Rather
# than guess a schedule, this runs every morning and stops immediately if
# no new results have arrived since the database the site is serving.
#
# Every run then checks the deployed site, whether or not it published.
# Pushing a commit and serving it are separate systems joined by a branch
# name, so the job can succeed for weeks while the site sits still; the
# only way to know the chain is intact is to look at the far end of it.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Retrain and publish even if no new results have arrived"
        type: boolean
        default: false

concurrency:
  group: update-predictions
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Install dependencies
        run: pip install -r requirements-pipeline.txt

      - name: Ingest results, retrain and predict the next gameweek
        id: pipeline
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            python scripts/run_pipeline.py
          else
            python scripts/run_pipeline.py --skip-if-unchanged
          fi

      - name: Export the serving database
        if: steps.pipeline.outputs.changed == 'true'
        run: python scripts/export_web_db.py

      # A published database that the site cannot read would take the
      # whole site down until someone noticed. Checking here costs
      # seconds and keeps a bad export from ever being committed.
      - name: Check the site serves from the new database
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from plpredict.web.app import create_app, resolve_database

          path, read_only = resolve_database()
          print(f"serving {path} (read_only={read_only})")
          assert read_only, "the exported database should be served read-only"

          client = create_app().test_client()
          for route in ("/", "/model"):
              response = client.get(route)
              assert response.status_code < 400, f"{route} returned {response.status_code}"

          # Follow the redirect to whichever gameweek is current.
          landing = client.get("/", follow_redirects=True)
          assert landing.status_code == 200, landing.status_code
          assert b"Gameweek" in landing.data
          print("smoke check passed")
          PY

      - name: Commit and push
        id: publish
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/web/plpredict-web.db
          if git diff --staged --quiet; then
            echo "Serving database is byte-identical; nothing to commit."
            exit 0
          fi
          git commit -m "Update predictions through $(date -u +'%Y-%m-%d')"
          # Pick up anything pushed by hand since the job started. The job
          # only ever touches the serving database, so this rebases cleanly
          # against code changes; a genuine conflict should fail loudly
          # rather than be resolved blindly.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A scheduled workflow only ever runs on the default branch, but the
      # site is deployed from whichever branch the host was pointed at when
      # the project was imported. Those were the same branch until the
      # default was renamed, and then they were not: the job carried on
      # pushing and going green while production went on serving a branch
      # nothing was being pushed to any more.
      #
      # Rather than depend on two names staying in step, carry the new
      # commit onto every other branch that can take it as a fast-forward.
      # There is no --force anywhere here: a branch holding work of its own
      # is rejected by the server and left exactly as it was. Set the
      # repository variable SYNC_DEPLOY_BRANCHES to "false" to turn it off.
      - name: Carry the update onto the other deployment branches
        if: steps.publish.outputs.pushed == 'true' && vars.SYNC_DEPLOY_BRANCHES != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branches=$(
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            | python3 -c 'import json,sys; print("\n".join(b["name"] for b in json.load(sys.stdin)))'
          )
          for branch in $branches; do
            if [ "$branch" = "${GITHUB_REF_NAME}" ]; then
              continue
            fi
            if git push origin "HEAD:refs/heads/${branch}" 2>/dev/null; then
              echo "Advanced ${branch}."
              echo "- advanced \`${branch}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Left ${branch} alone; it carries commits of its own."
              echo "- left \`${branch}\` alone (it carries commits of its own)" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # Runs whether or not anything was published. A run with nothing to
      # do should still be serving a current forecast; if it is not, the
      # job has quietly stopped working and needs to say so.
      - name: Check every played gameweek has a prediction of record
        id: published
        run: python scripts/check_publication.py

      # The end of the chain, and the only step that can see the failure
      # the rest of this file is arranged around: everything upstream can
      # be green while the deployed site is a fortnight out of date.
      - name: Check the live site is serving it
        env:
          PLPRED_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python scripts/check_live_site.py \
            --gameweek "${{ steps.published.outputs.gameweek }}"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.pipeline.outputs.changed }}" = "true" ]; then
            echo "Published gameweek ${{ steps.published.outputs.gameweek }}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No new results since the last run; gameweek ${{ steps.published.outputs.gameweek }} still current." >> "$GITHUB_STEP_SUMMARY"
          fi
